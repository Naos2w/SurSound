name: SurSoundReceiver
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  SurSoundReceiver:
    type: application
    platform: iOS
    sources:
      - path: SurSoundReceiver
        excludes: [Info.plist]
      - path: Shared
        excludes: [SurSound.entitlements]
    dependencies:
      - target: SurSoundBroadcast
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naos.sursound.receiver
        INFOPLIST_FILE: SurSoundReceiver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Shared/SurSound.entitlements
  SurSoundBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: SurSoundBroadcast
        excludes: [Info.plist]
      - path: Shared
        excludes: [SurSound.entitlements]
      - path: SurSoundReceiver/LanPacket.swift
      - path: SurSoundReceiver/SyncWire.swift
      - path: SurSoundReceiver/GroupToneTransport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naos.sursound.receiver.broadcast
        INFOPLIST_FILE: SurSoundBroadcast/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Shared/SurSound.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  SurSoundReceiverTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SurSoundReceiverTests]
    dependencies:
      - target: SurSoundReceiver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naos.sursound.receiver.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SurSoundReceiver:
    build:
      targets:
        SurSoundReceiver: all
        SurSoundBroadcast: all
    test:
      targets: [SurSoundReceiverTests]
